[project]
name = "mes"
version = "0.1.0"
description = "Proxia (MES) -> SCE Synchronisation: Transportauftraege fuer das Stapler-Leitsystem (Milk Run)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
